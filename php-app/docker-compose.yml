version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: saranya_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: saranya_db
    ports:
      - "3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

  web:
    image: php:8.2-apache
    container_name: saranya_php
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html/
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: saranya_db
      DB_USER: root
      DB_PASS: root
      MOCK_MODE: "true"
    depends_on:
      - db

volumes:
  mysql_data:
